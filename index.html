<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Juego de subastas con 5 temas nuevos cada día. Juega en la misma pantalla o en línea con un amigo.">
<title>El Que Más Puja</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titan+One&family=Baloo+2:wght@500;600;700;800&display=swap">
<style>
/* Layout: casa de subastas de feria. Calcomanías con borde de tinta sobre un cielo punteado; tablero en 3 columnas (jugador · lote · jugador), apilado en móvil. */
:root{
  --sky:#BFE6FF; --sky-dot:#A6DAFB;
  --ink:#1B1530; --paper:#FFFFFF; --muted:#5C5577; --soft:#F3F0FF;
  --p0:#FF4D5E; --p0-soft:#FFE1E4;
  --p1:#2F6BFF; --p1-soft:#DDE7FF;
  --gold:#FFC531; --gold-deep:#E09A00; --mint:#2ED19A; --pink:#FF7BC8;
  --display:'Titan One','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --body:'Baloo 2','Nunito','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  background-color:var(--sky);
  background-image:radial-gradient(var(--sky-dot) 2px,transparent 2.5px);
  background-size:22px 22px;
  color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px 48px;
}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.sticker{background:var(--paper);border:3px solid var(--ink);border-radius:20px;box-shadow:5px 5px 0 var(--ink)}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
.eyebrow{font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:12px;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* ----- top bar ----- */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.gavel{width:52px;height:52px;border-radius:50%;background:var(--gold);border:3px solid var(--ink);display:grid;place-items:center;font-size:28px;box-shadow:3px 3px 0 var(--ink);transform:rotate(-8deg)}
.brand h1{font-size:clamp(26px,5vw,40px);line-height:1;color:var(--ink)}
.brand h1 span{color:var(--p0)}
.brand small{display:block;font-weight:700;color:var(--muted);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:2px solid var(--ink);border-radius:999px;background:var(--paper);font-weight:700;font-size:14px}
.btn{border:3px solid var(--ink);border-radius:14px;background:var(--paper);padding:10px 16px;font-weight:800;box-shadow:3px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:not(:disabled):hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn:not(:disabled):active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.big{font-family:var(--display);font-weight:400;font-size:20px;padding:12px 22px}
.btn.gold{background:var(--gold)}
.btn.mint{background:var(--mint)}
.btn.pink{background:var(--pink)}
.btn.p0{background:var(--p0);color:#fff}
.btn.p1{background:var(--p1);color:#fff}
.btn.ghost{background:transparent;box-shadow:none}

/* ----- home ----- */
.hero{padding:20px 22px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-end;background:var(--ink);color:#fff;border-radius:22px;border:3px solid var(--ink);box-shadow:5px 5px 0 var(--p0)}
.hero h2{font-size:clamp(24px,4.4vw,38px);color:var(--gold)}
.hero p{margin:4px 0 0;max-width:60ch;color:#E6E1FF}
.countdown{text-align:right}
.countdown .eyebrow{color:#BDB5E8}
.countdown b{font-family:var(--display);font-weight:400;font-size:30px;color:#fff;font-variant-numeric:tabular-nums}
.themes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.theme{position:relative;text-align:left;padding:0;overflow:hidden;display:flex;flex-direction:column;border:3px solid var(--ink);border-radius:20px;background:var(--paper);box-shadow:5px 5px 0 var(--ink);transition:transform .12s}
.theme:hover{transform:translateY(-3px) rotate(-.6deg)}
.theme.sel{box-shadow:5px 5px 0 var(--ink),0 0 0 5px var(--gold);transform:translateY(-4px)}
.theme .tart{height:116px;display:grid;place-items:center;font-size:60px;background:radial-gradient(circle at 50% 60%,rgba(255,255,255,.55) 0 28%,transparent 29%),repeating-conic-gradient(from 0deg,var(--a) 0 12deg,var(--b) 12deg 24deg);border-bottom:3px solid var(--ink)}
.theme .tbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.theme h3{font-size:19px;line-height:1.15}
.theme .peek{font-size:20px;letter-spacing:2px;opacity:.9}
.cat{display:inline-flex;align-self:flex-start;align-items:center;gap:5px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:3px 9px;border-radius:999px;border:2px solid var(--ink);background:var(--soft)}
.theme .tick{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;background:var(--gold);border:3px solid var(--ink);display:none;place-items:center;font-weight:800}
.theme.sel .tick{display:grid}
.setup{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px}
.panel{padding:20px;display:flex;flex-direction:column;gap:14px}
.seg{display:flex;border:3px solid var(--ink);border-radius:14px;overflow:hidden;align-self:flex-start;flex-wrap:wrap}
.seg button{border:0;background:var(--paper);padding:9px 16px;font-weight:800}
.seg button+button{border-left:3px solid var(--ink)}
.seg button.on{background:var(--ink);color:#fff}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:14px}
input.t{font:inherit;font-weight:700;font-size:18px;border:3px solid var(--ink);border-radius:12px;padding:8px 12px;background:var(--paper);color:var(--ink);width:100%}
input.t.code{text-transform:uppercase;letter-spacing:.3em;font-family:var(--display);font-weight:400}
.rules ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.rules li::marker{font-family:var(--display);color:var(--p0)}
.note{font-size:14px;color:var(--muted);margin:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-weight:800;font-size:13px}
.or::before,.or::after{content:"";flex:1;border-top:2px dashed var(--muted);opacity:.5}

/* ----- board ----- */
.gamehead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 16px}
.gamehead .gt{display:flex;align-items:center;gap:12px;min-width:0}
.gamehead .ge{font-size:36px}
.gamehead h2{font-size:clamp(20px,3vw,28px)}
.progress{display:flex;gap:4px}
.progress i{width:14px;height:14px;border-radius:4px;border:2px solid var(--ink);background:var(--paper)}
.progress i.on{background:var(--mint)}
.board{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr) minmax(0,1fr);grid-template-areas:"p0 stage p1";gap:18px;align-items:start}
.pl{padding:16px;display:flex;flex-direction:column;gap:12px;position:relative;transition:transform .2s}
.pl.p0{grid-area:p0;--pc:var(--p0);--ps:var(--p0-soft)}
.pl.p1{grid-area:p1;--pc:var(--p1);--ps:var(--p1-soft)}
.pl.turn{transform:translateY(-4px);box-shadow:5px 5px 0 var(--ink),0 0 0 5px var(--pc)}
.pl .ph{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pl .pn{display:flex;align-items:center;gap:8px;min-width:0}
.pl .pn b{font-family:var(--display);font-weight:400;font-size:22px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .dot{width:16px;height:16px;border-radius:50%;background:var(--pc);border:2px solid var(--ink);flex:none}
.badge{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:3px 8px;border-radius:999px;border:2px solid var(--ink);background:var(--gold);white-space:nowrap}
.badge.full{background:var(--mint)}
.badge.broke{background:var(--paper)}
.purse{display:flex;align-items:center;gap:12px;background:var(--ps);border:2px solid var(--ink);border-radius:14px;padding:8px 12px}
.coin{width:42px;height:42px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE58A,var(--gold) 55%,var(--gold-deep));border:3px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-size:18px;flex:none}
.purse .amt{font-family:var(--display);font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.purse small{display:block;font-weight:700;color:var(--muted);font-size:13px}
.purse.bump .amt{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.35)}}
.coinrow{display:flex;flex-wrap:wrap;gap:3px}
.coinrow i{width:11px;height:11px;border-radius:50%;background:var(--gold);border:1.5px solid var(--ink)}
.coinrow i.gone{background:transparent;border-style:dashed;opacity:.4}
.slots{display:flex;flex-direction:column;gap:8px}
.slot{display:flex;align-items:center;gap:10px;border:2px dashed rgba(27,21,48,.35);border-radius:12px;padding:6px 10px;min-height:54px;color:var(--muted);font-weight:700}
.slot .se{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:24px;flex:none}
.slot.filled{border:2px solid var(--ink);background:var(--paper);color:var(--ink)}
.slot.filled .se{background:linear-gradient(135deg,var(--a),var(--b));border:2px solid var(--ink)}
.slot .sn{min-width:0;display:flex;flex-direction:column;line-height:1.15}
.slot .sn b{font-size:15px}
.slot .sn span{font-size:12px;color:var(--gold-deep);letter-spacing:1px}
.slot.new{animation:pop .6s}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.06)}100%{transform:none;opacity:1}}
.score{font-weight:800;display:flex;justify-content:space-between;border-top:2px dashed rgba(27,21,48,.3);padding-top:8px}

.stage{grid-area:stage;display:flex;flex-direction:column;gap:14px}
.card{--a:#2F6BFF;--b:#2ED19A;padding:14px;display:flex;flex-direction:column;gap:10px;perspective:800px}
.card.flip{animation:flip .7s cubic-bezier(.2,.8,.3,1.2)}
@keyframes flip{0%{transform:rotateY(90deg) scale(.85);opacity:.2}100%{transform:none;opacity:1}}
.card .ctop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lot{font-family:var(--display);font-size:15px;background:var(--ink);color:#fff;padding:3px 10px;border-radius:8px}
.art{position:relative;height:230px;border-radius:14px;border:3px solid var(--ink);overflow:hidden;display:grid;place-items:center;background:var(--a)}
.art .burst{position:absolute;inset:-50%;background:repeating-conic-gradient(from 0deg,var(--a) 0 10deg,var(--b) 10deg 20deg);animation:spin 40s linear infinite}
.art .halo{position:absolute;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.75);border:3px solid var(--ink)}
.art .em{position:relative;font-size:104px;line-height:1;filter:drop-shadow(4px 5px 0 rgba(27,21,48,.35));animation:bob 2.6s ease-in-out infinite}
.art .tag{position:absolute;left:12px;bottom:12px;background:var(--paper);border:2px solid var(--ink);border-radius:10px;padding:2px 10px;font-weight:800;font-size:13px}
.art .spark{position:absolute;font-size:22px;animation:twinkle 1.8s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{50%{transform:translateY(-8px) rotate(3deg)}}
@keyframes twinkle{50%{transform:scale(1.4);opacity:.4}}
.card h2{font-size:clamp(24px,3.4vw,32px);text-align:center}
.stars{text-align:center;font-size:26px;letter-spacing:4px;color:var(--gold-deep);line-height:1}

.stars.troll{color:#D3263A;font-family:var(--display);font-size:24px;letter-spacing:0}
.card.troll .art .em{animation:wobble 1.2s ease-in-out infinite}
@keyframes wobble{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
.trolltag{position:absolute;right:12px;top:12px;background:#D3263A;color:#fff;border:2px solid var(--ink);border-radius:10px;padding:2px 10px;font-family:var(--display);transform:rotate(6deg)}
.slot .sn span.tr{color:#D3263A;letter-spacing:0;font-weight:800}
.stars .off{color:rgba(27,21,48,.18)}
.stars small{display:block;font-family:var(--body);font-size:13px;letter-spacing:0;color:var(--muted);font-weight:700;margin-top:4px}
.bidbox{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.bidline{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.bidnow{display:flex;align-items:center;gap:10px}
.bidnow .coin{width:50px;height:50px;font-size:22px}
.bidnow b{font-family:var(--display);font-weight:400;font-size:22px}
.turnlbl{font-family:var(--display);font-size:18px;padding:6px 12px;border-radius:12px;border:2px solid var(--ink);color:#fff;background:var(--tc,var(--ink))}
.stepper{display:flex;align-items:stretch;border:3px solid var(--ink);border-radius:14px;overflow:hidden;background:var(--paper)}
.stepper button{border:0;background:var(--soft);width:46px;font-size:22px;font-weight:800}
.stepper input{width:72px;border:0;border-inline:3px solid var(--ink);text-align:center;font-family:var(--display);font-size:24px;color:var(--ink);background:var(--paper);-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:2px solid var(--ink);border-radius:999px;background:var(--paper);padding:4px 12px;font-weight:800}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions .btn{flex:1 1 auto}
.endorse{border:2px dashed var(--ink);border-radius:14px;padding:12px;background:#FFF6D8;display:flex;flex-direction:column;gap:10px}
.banner{border:3px solid var(--ink);border-radius:14px;padding:10px 14px;font-weight:700;background:#FFF6D8}
.banner.warn{background:#FFE1E4}
.banner.info{background:#E2FBF1}
.waiting{font-weight:800;color:var(--muted);display:flex;align-items:center;gap:8px}
.waiting::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--muted);animation:twinkle 1s infinite}
.log{padding:12px 16px}
.log ul{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:14px}
.log li{padding:4px 8px;border-radius:8px;background:var(--soft)}
.log li:first-child{background:#FFF6D8;font-weight:700}

/* ----- lobby ----- */
.lobby{padding:24px;display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center;max-width:620px;margin:0 auto;width:100%}
.bigcode{font-family:var(--display);font-size:clamp(46px,12vw,72px);letter-spacing:.18em;background:var(--gold);border:3px solid var(--ink);border-radius:18px;padding:4px 18px 4px 30px;box-shadow:4px 4px 0 var(--ink)}

/* ----- results ----- */
.results{padding:18px;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.results h2{font-size:clamp(26px,4vw,38px)}
.results img{width:100%;border:3px solid var(--ink);border-radius:14px;display:block}
.tally{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:100%}
.tally div{border:2px solid var(--ink);border-radius:14px;padding:10px;background:var(--soft)}
.tally b{font-family:var(--display);font-weight:400;font-size:28px;display:block}

.netbar{display:flex;gap:8px;flex-wrap:wrap}
.toasts{position:fixed;left:0;right:0;bottom:0;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;z-index:20}
.toast{background:var(--ink);color:#fff;border-radius:14px;padding:10px 16px;font-weight:700;max-width:520px;box-shadow:4px 4px 0 var(--gold);animation:pop .3s}
.confetti{position:fixed;top:-20px;width:12px;height:16px;z-index:30;pointer-events:none;animation:fall 2.8s linear forwards;border:1.5px solid var(--ink)}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

@media (max-width:980px){
  .themes{grid-template-columns:repeat(2,minmax(0,1fr))}
  .themes .theme:last-child{grid-column:1/-1}
  .setup{grid-template-columns:minmax(0,1fr)}
  .board{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-areas:"stage stage" "p0 p1"}
}
@media (max-width:560px){
  .fields{grid-template-columns:minmax(0,1fr)}
  .board{gap:12px}
  .pl{padding:10px;gap:8px}
  .pl .pn b{font-size:17px}
  .purse{padding:6px 8px;gap:8px}
  .purse .coin{width:32px;height:32px;font-size:14px}
  .purse .amt{font-size:24px}
  .slot{min-height:44px;padding:4px 6px;gap:6px}
  .slot .se{width:32px;height:32px;font-size:19px}
  .slot .sn b{font-size:13px}
  .coinrow{display:none}
  .art{height:190px}
  .art .em{font-size:84px}
  .art .halo{width:140px;height:140px}
  .countdown{text-align:left}
  .theme .tart{height:90px;font-size:46px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>

</head>

};

  {c:'Deportes',e:'⚽',t:'Arma el mejor equipo de fútbol',x:'🤕 Lesionado eterno;🐌 Defensa más lento del mundo;🧈 Portero manos de mantequilla',i:'🐐 Lionel Messi;👑 Cristiano Ronaldo;⚡ Kylian Mbappé;🤖 Erling Haaland;🕺 Vinícius Jr.;🎩 Jude Bellingham;🌟 Lamine Yamal;🏹 Mohamed Salah;🛡️ Virgil van Dijk;🧤 Thibaut Courtois;🧠 Rodri;🔥 Luis Díaz'},

const parseItems=(str,troll)=>str.split(';').map(x=>{const k=x.indexOf(' ');return{e:x.slice(0,k),n:x.slice(k+1),troll}});
THEMES.forEach(t=>{t.items=parseItems(t.i,false).concat(parseItems(t.x,true))});
const SLOTS=5, START_COINS=20;

/* ================= UTILIDADES ================= */
function seeded(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}let a=h>>>0;
  return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(arr,rnd){for(let i=arr.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function dayKey(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dailyThemes(day){const rnd=seeded('temas|'+day);const cats=shuffle(Object.keys(CATS),rnd).slice(0,5);
  return cats.map(c=>{const list=THEMES.map((t,i)=>t.c===c?i:-1).filter(i=>i>=0);return list[Math.floor(rnd()*list.length)]})}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const store={get(k,d){try{const v=localStorage.getItem('eqmp.'+k);return v==null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem('eqmp.'+k,JSON.stringify(v))}catch{}}};

/* ================= MOTOR DEL JUEGO ================= */
function newGame(ti,names,day){
  const t=THEMES[ti];
  const st={v:1,day,th:ti,deck:shuffle(t.items.map((_,i)=>i),Math.random),cur:null,
    p:names.map(n=>({n,c:START_COINS,it:[]})),ph:'auction',turn:0,start:1,bid:0,hb:-1,passed:0,dec:-1,log:[]};
  addLog(st,`Empieza la subasta: ${t.t}`);next(st);return st;
}
function addLog(s,m){s.log.unshift(m);s.log=s.log.slice(0,7)}
function itemOf(s,i){return THEMES[s.th].items[i]}
function next(s){
  const full=s.p.map(p=>p.it.length>=SLOTS);
  if((full[0]&&full[1])||!s.deck.length){s.ph='end';s.cur=null;s.turn=-1;addLog(s,'¡Plantillas completas!');return}
  s.cur=s.deck.shift();s.bid=0;s.hb=-1;s.passed=0;s.eb=0;s.eby=-1;
  if(full[0]||full[1]){s.ph='free';s.dec=full[0]?1:0;s.turn=s.dec;return}
  const broke=s.p.map(p=>p.c<=0);
  if(broke[0]||broke[1]){s.ph='decide';s.dec=(broke[0]&&broke[1])?(s.start=1-s.start):(broke[0]?1:0);s.turn=s.dec;return}
  s.ph='auction';s.start=1-s.start;s.turn=s.start;
}
function award(s){const w=s.p[s.hb];const it=itemOf(s,s.cur);w.c-=s.bid;w.it.push(s.cur);
  addLog(s,`🔨 ${w.n} gana ${it.e} ${it.n} por ${s.bid} 🪙`);if(w.c===0)addLog(s,`${w.n} se quedó sin monedas`);next(s)}
function acceptDump(s){const payer=s.p[s.eby],taker=s.p[1-s.eby],it=itemOf(s,s.cur);
  payer.c-=s.eb;taker.c+=s.eb;taker.it.push(s.cur);
  addLog(s,`🤝 ${taker.n} se queda con ${it.e} ${it.n} y recibe ${s.eb} 🪙 de ${payer.n}`);
  if(payer.c===0)addLog(s,`${payer.n} se quedó sin monedas`);next(s)}
function apply(s0,a,who){
  const s=clone(s0);
  if(s.ph==='end')return{err:'La partida ya terminó'};
  if(who!==s.turn)return{err:'No es tu turno'};
  const me=s.p[who],ot=s.p[1-who],it=itemOf(s,s.cur),nm=it.e+' '+it.n,amt=Math.floor(Number(a.a)||0);
  switch(a.t){
    case'bid':
      if(s.ph!=='auction')return{err:'Ahora no se puede pujar'};
      if(me.it.length>=SLOTS)return{err:'Ya tienes 5 elementos en tu plantilla'};
      if(amt<=s.bid)return{err:`Tu puja debe ser mayor a ${s.bid} 🪙`};
      if(amt>me.c)return{err:`No puedes pujar ${amt}: solo tienes ${me.c} 🪙`};
      s.bid=amt;s.hb=who;addLog(s,`${me.n} puja ${amt} 🪙 por ${nm}`);
      if(ot.c<=amt){addLog(s,`${ot.n} no tiene monedas para superarla`);award(s)}else s.turn=1-who;break;
    case'pass':
      if(s.ph!=='auction')return{err:'Ahora no se puede pasar'};
      if(s.hb>=0){addLog(s,`${me.n} no sube la puja`);award(s);break}
      s.passed++;addLog(s,`${me.n} pasa`);
      if(s.passed>=2){addLog(s,`Nadie quiso ${nm}; vuelve al final de la fila`);s.deck.push(s.cur);next(s)}else s.turn=1-who;break;
    case'endorse':{
      if(s.ph!=='auction'&&s.ph!=='dump')return{err:'Ahora no se puede endosar'};
      if(ot.it.length>=SLOTS)return{err:`${ot.n} ya tiene 5 elementos; no le puedes endosar más`};
      const emin=s.ph==='dump'?s.eb+1:1;
      if(amt<emin)return{err:s.ph==='dump'?`Para devolverlo debes ofrecer más de ${s.eb} 🪙`:'Ofrece al menos 1 🪙 para endosar'};
      if(amt>me.c)return{err:`Solo tienes ${me.c} 🪙`};
      addLog(s,s.ph==='dump'?`💸 ${me.n} sube a ${amt} 🪙 para devolverle ${nm} a ${ot.n}`:`💸 ${me.n} ofrece ${amt} 🪙 a ${ot.n} para endosarle ${nm}`);
      s.ph='dump';s.eb=amt;s.eby=who;s.bid=0;s.hb=-1;s.turn=1-who;
      if(ot.c<=amt){addLog(s,`${ot.n} no tiene monedas para devolverlo`);acceptDump(s)}
      break}
    case'accept':
      if(s.ph!=='dump')return{err:'No hay ningún endoso que aceptar'};
      acceptDump(s);break;
    case'keep':
      if(s.ph!=='decide'&&s.ph!=='free')return{err:'Ahora no se puede'};
      if(me.it.length>=SLOTS)return{err:'Ya tienes 5 elementos en tu plantilla'};
      me.it.push(s.cur);addLog(s,`${me.n} se queda con ${nm}`);next(s);break;
    case'give':
      if(s.ph!=='decide')return{err:'Ahora no se puede'};
      if(ot.it.length>=SLOTS)return{err:`${ot.n} ya tiene 5 elementos en su plantilla`};
      ot.it.push(s.cur);addLog(s,`${me.n} le manda ${nm} a ${ot.n}`);next(s);break;
    case'skip':
      if(s.ph!=='free')return{err:'Ahora no se puede'};
      if(s.deck.length<SLOTS-me.it.length)return{err:'Ya no quedan elementos suficientes para descartar'};
      addLog(s,`${me.n} descarta ${nm}`);next(s);break;
    default:return{err:'Acción desconocida'};
  }
  s.v++;return{s};
}

function myIdx(){if(app.mode!=='online'||!app.net)return app.st?app.st.turn:0;return app.net.role==='host'?0:1}
function canAct(){const s=app.st;if(!s||s.ph==='end')return false;if(app.mode!=='online')return true;return s.turn===myIdx()&&!(app.net&&app.net.pending)}
function setState(ns){const prev=app.st;app.st=ns;afterChange(prev,ns)}
function afterChange(prev,s){
  if(!s)return;
  s.p.forEach((p,i)=>{
    const was=prev?prev.p[i]:null;
    if(was&&was.it.length<SLOTS&&p.it.length>=SLOTS)toast(`⚠️ ${p.n} ya tiene 5 elementos en su plantilla. Ya no puede pujar.`);
    if(was&&was.c>0&&p.c<=0&&s.ph!=='end')toast(`🪙 ${p.n} se quedó sin monedas. ${s.p[1-i].n} decide a dónde va cada elemento.`);
  });
  app.bump=prev?s.p.map((p,i)=>prev.p[i].c!==p.c):null;
  if(!prev||prev.cur!==s.cur)app.ui.endOpen=false;
  app.ui.end=s.ph==='dump'?s.eb+1:1;
  const me=s.turn>=0?s.p[s.turn]:null;app.ui.bid=me?Math.min(s.bid+1,Math.max(me.c,1)):1;
  if(s.ph==='end'&&(!prev||prev.ph!=='end'))setTimeout(confetti,250);
  render();
}
function doAct(a){
  const s=app.st;if(!s)return;
  if(app.mode!=='online'){const r=apply(s,a,s.turn);if(r.err)return toast(r.err);setState(r.s);return}
  const who=myIdx();const r=apply(s,a,who);if(r.err)return toast(r.err);
  if(app.net.role==='host'){setState(r.s);pushState()}
  else{if(!app.net.open)return toast('Sin conexión con el anfitrión. Toca Reconectar.');app.net.pending=true;app.net.conn.send({t:'act',a});
    clearTimeout(app.net.pt);app.net.pt=setTimeout(()=>{if(app.net&&app.net.pending){app.net.pending=false;render()}},4000);render()}
}
function pushState(){const n=app.net;if(n&&n.role==='host'&&n.conn&&n.conn.open)n.conn.send({t:'st',st:app.st,host:app.myName||'Anfitrión'})}

const CODE_CH='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const PEER_OPTS=(()=>{try{const q=new URLSearchParams(location.search).get('peerhost');if(!q)return{};const[host,port]=q.split(':');return{host,port:+port||9000,path:'/',secure:false}}catch{return{}}})();
function readMyName(){const el=document.getElementById('myname');const v=((el&&el.value.trim())||'').slice(0,14);if(v){app.myName=v;store.set('myName',v)}return v}
function newPeer(id){return new Promise((res,rej)=>{let p;try{p=id?new Peer(id,PEER_OPTS):new Peer(PEER_OPTS)}catch(e){rej(e);return}
  const t=setTimeout(()=>{rej({type:'timeout'});try{p.destroy()}catch{}},15000);
  p.on('open',()=>{clearTimeout(t);res(p)});p.on('error',e=>{clearTimeout(t);rej(e)})})}
async function createRoom(){
  if(roomState!=='on')return toast('El modo en línea no está disponible');
  const name=readMyName();if(!name)return toast('Escribe tu nombre primero');
  let peer=null,code='';
  for(let k=0;k<4&&!peer;k++){code='';for(let i=0;i<4;i++)code+=CODE_CH[Math.floor(Math.random()*CODE_CH.length)];
    try{peer=await newPeer('eqmp-'+code.toLowerCase())}catch(e){if(!e||e.type!=='unavailable-id'){toast('No se pudo crear la sala. Revisa tu conexión.');return}}}
  if(!peer)return toast('No se pudo crear la sala. Intenta de nuevo.');
  const n={role:'host',peer,code,conn:null,guest:null,pending:false,theme:dailyThemes(dayKey())[app.sel]};
  app.net=n;app.mode='online';app.screen='lobby';app.st=null;
  peer.on('connection',conn=>{
    conn.on('data',d=>onHostData(n,conn,d));
    conn.on('close',()=>{if(app.net!==n||n.conn!==conn)return;n.conn=null;toast(`${n.guest||'Tu rival'} salió de la sala`);if(!app.st)n.guest=null;render()});
  });
  peer.on('disconnected',()=>{if(app.net===n&&!peer.destroyed)try{peer.reconnect()}catch{}});
  peer.on('error',e=>{if(app.net===n&&e&&(e.type==='network'||e.type==='server-error'))toast('Problema de conexión con el servidor de salas')});
  render();
}
function onHostData(n,conn,d){
  if(app.net!==n||!d||typeof d!=='object')return;

    const nm=String(d.name||'Invitado').slice(0,14);
    if((n.conn&&n.conn!==conn&&n.conn.open)||(app.st&&n.guest&&nm!==n.guest)){conn.send({t:'full'});setTimeout(()=>conn.close(),400);return}
    const back=app.st&&!n.conn;n.conn=conn;n.guest=nm;if(back)toast(`${nm} volvió a la sala`);
    pushState();render();return}
  if(d.t==='act'&&conn===n.conn&&app.st&&d.a&&typeof d.a==='object'){const r=apply(app.st,d.a,1);if(r.s){setState(r.s);pushState()}else conn.send({t:'err',m:r.err})}

function connectGuest(){
  const n=app.net;if(!n||n.role!=='guest')return;n.notFound=false;

    const e=Math.max(1,Math.min(app.ui.end,me.c));app.ui.end=e;
    controls=`${canBid?`<div class="row"><div class="stepper"><button data-act="step" data-d="-1" aria-label="Bajar puja">−</button><input id="bidamt" type="number" inputmode="numeric" min="${min}" max="${me.c}" value="${b}" aria-label="Monto de la puja"><button data-act="step" data-d="1" aria-label="Subir puja">+</button></div>
        <div class="chips"><button data-act="chip" data-v="${min}">Mínimo ${min}</button>${me.c>=min+2?`<button data-act="chip" data-v="${min+2}">+3</button>`:''}${me.c>=min+4?`<button data-act="chip" data-v="${min+4}">+5</button>`:''}<button data-act="chip" data-v="${me.c}">Todo (${me.c})</button></div></div>`
      :`<div class="banner warn">Solo tienes ${me.c} 🪙: no te alcanza para superar ${s.bid}.</div>`}
      <div class="actions">${canBid?`<button class="btn big p${who}" data-act="bid" id="bidbtn">Pujar ${b} 🪙</button>`:''}<button class="btn big" data-act="pass">${hb?`Pasar (gana ${esc(hb.n)})`:'Pasar'}</button>
        <button class="btn big pink" data-act="toggleEnd" ${me.c<1||ot.it.length>=SLOTS?'disabled':''}>💸 Endosar</button></div>
      ${app.ui.endOpen?`<div class="endorse"><b>Ofrece monedas a ${esc(ot.n)} para que se quede con este elemento. Puede aceptar o pagarte más para devolvértelo.</b>
        <div class="row"><div class="stepper"><button data-act="estep" data-d="-1" aria-label="Menos">−</button><input id="endamt" type="number" inputmode="numeric" min="1" max="${me.c}" value="${e}" aria-label="Monedas para endosar"><button data-act="estep" data-d="1" aria-label="Más">+</button></div>
        <button class="btn pink" data-act="endorse" id="endbtn">Ofrecer ${e} 🪙 y endosar</button></div></div>`:''}`;
  }
  return `<section class="bidbox sticker"><div class="bidline">${status}<span class="turnlbl" style="--tc:${col}">${youLbl}</span></div>${controls}</section>`;
}
function renderResults(s){
  const host=app.mode!=='online'||(app.net&&app.net.role==='host');
  return `<section class="results sticker"><div class="eyebrow">Resultado final</div>
    <h2>¡Plantillas completas!</h2><p class="note">¿Cuál quedó mejor? Eso lo deciden ustedes.</p>
    <div class="tally">${s.p.map((p,i)=>`<div style="background:var(--p${i}-soft)"><span>${esc(p.n)}</span><b class="num">${p.c} 🪙</b><small>monedas que le sobraron</small></div>`).join('')}</div>
    <img id="resimg" alt="Imagen con las dos plantillas finales">
    <div class="row" style="justify-content:center"><button class="btn big gold" data-act="download">⬇️ Descargar imagen</button>
      ${host?`<button class="btn big mint" data-act="rematch">🔁 Revancha</button>`:`<span class="note">El anfitrión puede iniciar la revancha.</span>`}
      <button class="btn big" data-act="home">Elegir otro tema</button></div></section>`;
}

/* ================= IMAGEN FINAL ================= */
let resultCanvas=null;
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function drawResult(s){
  const t=THEMES[s.th],c=CATS[t.c],W=1200,H=900,cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d');
  const g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,c.a);g.addColorStop(1,c.b);x.fillStyle=g;x.fillRect(0,0,W,H);
  x.save();x.translate(W/2,170);for(let k=0;k<36;k++){x.rotate(Math.PI/18);x.fillStyle=k%2?'rgba(255,255,255,.10)':'rgba(255,255,255,0)';x.beginPath();x.moveTo(0,0);x.lineTo(1400,-120);x.lineTo(1400,120);x.fill()}x.restore();
  x.fillStyle='rgba(27,21,48,.12)';for(let yy=10;yy<H;yy+=26)for(let xx=10;xx<W;xx+=26){x.beginPath();x.arc(xx,yy,2,0,7);x.fill()}
  const D="'Titan One', 'Arial Rounded MT Bold', sans-serif",B="'Baloo 2', 'Segoe UI', sans-serif";
  x.textAlign='center';x.fillStyle='#1B1530';x.font=`28px ${D}`;x.fillText('EL QUE MÁS PUJA  ·  🔨',W/2,62);
  x.font=`54px ${D}`;x.lineWidth=10;x.strokeStyle='#1B1530';x.lineJoin='round';x.strokeText(`${t.e} ${t.t}`,W/2,128,W-80);x.fillStyle='#FFFFFF';x.fillText(`${t.e} ${t.t}`,W/2,128,W-80);
  const cols=['#FF4D5E','#2F6BFF'];
  for(let i=0;i<2;i++){
    const px=40+i*580,py=168,pw=540,ph=680,p=s.p[i];
    x.fillStyle='#1B1530';rr(x,px+8,py+8,pw,ph,26);x.fill();x.fillStyle='#FFFFFF';rr(x,px,py,pw,ph,26);x.fill();x.lineWidth=5;x.stroke();
    x.fillStyle=cols[i];rr(x,px,py,pw,92,26);x.fill();x.fillRect(px,py+60,pw,32);x.strokeStyle='#1B1530';x.lineWidth=5;rr(x,px,py,pw,ph,26);x.stroke();
    x.beginPath();x.moveTo(px,py+92);x.lineTo(px+pw,py+92);x.stroke();
    x.textAlign='left';x.fillStyle='#FFFFFF';x.font=`40px ${D}`;x.fillText(p.n,px+26,py+62,pw-52);
    for(let k=0;k<SLOTS;k++){
      const idx=p.it[k],y=py+112+k*104;x.fillStyle=k%2?'#F3F0FF':'#FFF6D8';rr(x,px+20,y,pw-40,92,18);x.fill();x.lineWidth=3;x.strokeStyle='#1B1530';x.stroke();
      if(idx==null){x.textAlign='left';x.fillStyle='#5C5577';x.font=`600 26px ${B}`;x.fillText('Espacio vacío',px+50,y+56);continue}
      const it=t.items[idx];const gg=x.createLinearGradient(px+34,y+10,px+106,y+82);gg.addColorStop(0,c.a);gg.addColorStop(1,c.b);
      x.fillStyle=gg;rr(x,px+34,y+10,72,72,16);x.fill();x.stroke();
      x.textAlign='center';x.font='46px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';x.fillStyle='#000';x.fillText(it.e,px+70,y+63);
      x.textAlign='left';x.fillStyle='#1B1530';x.font=`800 28px ${B}`;x.fillText(it.n,px+124,it.troll?y+44:y+56,pw-180);
      if(it.troll){x.fillStyle='#D3263A';x.font=`800 24px ${B}`;x.fillText('🤡 Troll',px+124,y+78)}
    }
    x.textAlign='left';x.fillStyle='#1B1530';x.font=`700 24px ${B}`;x.fillText(`${p.c} monedas sobrantes`,px+26,py+ph-22);
  }
  x.textAlign='center';x.fillStyle='#1B1530';x.font=`700 22px ${B}`;
  x.fillText(new Intl.DateTimeFormat('es-MX',{day:'numeric',month:'long',year:'numeric'}).format(new Date()),W/2,H-16);
  return cv;
}
async function drawResultInto(){
  const img=document.getElementById('resimg');if(!img)return;
  try{await document.fonts.ready}catch{}
  resultCanvas=drawResult(app.st);img.src=resultCanvas.toDataURL('image/png');
}
async function downloadImage(){
  if(!resultCanvas)resultCanvas=drawResult(app.st);
  if(!DL){const l=document.createElement('a');l.href=resultCanvas.toDataURL('image/png');l.download='plantillas-el-que-mas-puja.png';document.body.appendChild(l);l.click();l.remove();return}
  const blob=await new Promise(r=>resultCanvas.toBlob(r,'image/png'));
  const slug=THEMES[app.st.th].t.toLowerCase().normalize('NFD').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  try{await DL.save({filename:`plantillas-${slug}.png`,data:blob});toast('Imagen guardada 🎉')}
  catch(e){if(e&&e.code==='declined')return;toast('No se pudo descargar. Mantén presionada la imagen para guardarla.')}
}

/* ================= EFECTOS ================= */
function toast(m){const el=document.createElement('div');el.className='toast';el.textContent=m;document.getElementById('toasts').appendChild(el);setTimeout(()=>el.remove(),3600)}
function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const cols=['#FF4D5E','#2F6BFF','#FFC531','#2ED19A','#FF7BC8'];
  for(let i=0;i<70;i++){const d=document.createElement('i');d.className='confetti';d.style.left=Math.random()*100+'vw';d.style.background=cols[i%5];d.style.animationDelay=Math.random()*.8+'s';d.style.animationDuration=2+Math.random()*1.6+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),4600)}}
function tickCountdown(){const el=document.getElementById('cd');if(!el)return;const n=new Date(),m=new Date(n);m.setHours(24,0,0,0);
  let s=Math.max(0,Math.floor((m-n)/1000));const h=Math.floor(s/3600);s%=3600;el.textContent=[h,Math.floor(s/60),s%60].map(v=>String(v).padStart(2,'0')).join(':')}
let lastDay=dayKey();
setInterval(()=>{tickCountdown();const d=dayKey();if(d!==lastDay){lastDay=d;if(app.screen==='home')render()}},1000);

/* ================= EVENTOS ================= */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const s=app.st,act=b.dataset.act;
  const me=s&&s.turn>=0?s.p[s.turn]:null;
  switch(act){
    case'pick':app.sel=+b.dataset.i;render();break;
    case'mode':app.mode=b.dataset.m;store.set('mode',app.mode);render();break;
    case'startLocal':startLocal();break;
    case'create':createRoom();break;
    case'join':joinRoom();break;
    case'startOnline':startOnline();break;
    case'copy':navigator.clipboard.writeText(app.net.code).then(()=>toast('Código copiado')).catch(()=>toast('Código: '+app.net.code));break;
    case'step':setBid(app.ui.bid+ +b.dataset.d);break;
    case'chip':setBid(+b.dataset.v);break;
    case'estep':setEnd(app.ui.end+ +b.dataset.d);break;
    case'bid':doAct({t:'bid',a:app.ui.bid});break;
    case'pass':doAct({t:'pass'});break;
    case'toggleEnd':app.ui.endOpen=!app.ui.endOpen;render();break;
    case'endorse':doAct({t:'endorse',a:app.ui.end});break;
    case'accept':doAct({t:'accept'});break;
    case'keep':doAct({t:'keep'});break;
    case'give':doAct({t:'give'});break;
    case'skip':doAct({t:'skip'});break;
    case'rematch':rematch();break;
    case'home':goHome();break;
    case'reconnect':connectGuest();render();break;
    case'download':downloadImage();break;
  }
});
function setBid(v){const s=app.st,me=s.p[s.turn],min=s.bid+1;
  if(v>me.c){toast(`No puedes pujar más de ${me.c} 🪙: es todo lo que tienes`);v=me.c}
  if(v<min){v=min}app.ui.bid=v;const i=document.getElementById('bidamt'),bb=document.getElementById('bidbtn');if(i)i.value=v;if(bb)bb.textContent=`Pujar ${v} 🪙`}
function setEnd(v){const s=app.st,me=s.p[s.turn],emin=s.ph==='dump'?s.eb+1:1;
  if(v>me.c){toast(`Solo tienes ${me.c} 🪙`);v=me.c}if(v<emin)v=emin;app.ui.end=v;const i=document.getElementById('endamt'),bb=document.getElementById('endbtn');if(i)i.value=v;if(bb)bb.textContent=app.st.ph==='dump'?`Pagar ${v} 🪙 y devolverlo`:`Ofrecer ${v} 🪙 y endosar`}
document.addEventListener('change',e=>{
  if(e.target.id==='bidamt')setBid(Math.floor(+e.target.value||0));
  if(e.target.id==='endamt')setEnd(Math.floor(+e.target.value||0));
});
document.addEventListener('input',e=>{
  const s=app.st;if(!s||s.turn<0)return;const me=s.p[s.turn];
  if((e.target.id==='bidamt'||e.target.id==='endamt')&&+e.target.value>me.c){toast(`No puedes usar más de ${me.c} 🪙: es todo lo que tienes`);e.target.value=me.c}
  if(e.target.id==='bidamt'&&e.target.value){const v=Math.floor(+e.target.value);app.ui.bid=v;const bb=document.getElementById('bidbtn');if(bb)bb.textContent=`Pujar ${v} 🪙`}
  if(e.target.id==='endamt'&&e.target.value){const v=Math.floor(+e.target.value);app.ui.end=v;const bb=document.getElementById('endbtn');if(bb)bb.textContent=app.st.ph==='dump'?`Pagar ${v} 🪙 y devolverlo`:`Ofrecer ${v} 🪙 y endosar`}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='code')joinRoom();
  if(e.key==='Enter'&&e.target.id==='bidamt'){setBid(Math.floor(+e.target.value||0));doAct({t:'bid',a:app.ui.bid})}
});

/* ================= ARRANQUE ================= */
roomState=window.Peer?'on':'off';
function start(data){
  if(data&&data.st&&data.mode==='local'){app.st=data.st;app.mode='local';app.screen='game';app.names=data.st.p.map(p=>p.n)}
  if(data&&typeof data.sel==='number')app.sel=data.sel;
  render();
}
window.claude?.hot?.snapshot?.(()=>({sel:app.sel,mode:app.mode,st:app.mode==='local'?app.st:null}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
